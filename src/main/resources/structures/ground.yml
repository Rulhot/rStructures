# Файл данжа. Имя файла = id типа. Убранный ключ берёт значение по умолчанию
# Название в меню и в сообщении о спавне
name: "<white>Наземный данж"

schematic:
  # Файл схемы из папки plugins/rStructures/schem/ или из schematic-folders в config.yml
  file: ground1.schem
  # true: воздух из схемы не затирает блоки мира
  ignore-air: true
  # Сдвиг схемы от найденной точки в блоках
  offset:
    x: 0
    y: 1
    z: 0
  # Что убрать с места перед вставкой. Игроков, питомцев и сущности с именем плагин не трогает
  clear:
    # Выброшенные предметы
    items: true
    # Враждебные мобы
    monsters: true
    # Животные
    animals: true
    # Лодки и вагонетки
    vehicles: false
    # Трава, цветы, листва
    vegetation: true
    # Вода и лава
    liquids: false
    # Снежный слой
    snow: true

spawn:
  # Мир для спавна
  world: world
  # ground: на земле, water: на воде, air: в воздухе
  placement: ground
  # Биомы для спавна. Если ни один не найден, данж не загрузится
  # plains или minecraft:plains: один биом
  # "*ocean*": все биомы, где в названии есть ocean. Строки со звёздочкой пиши в кавычках
  # "*": все биомы, "terralith:*": все биомы датапака Terralith
  biomes: [plains, sunflower_plains, meadow, snowy_plains]
  # Вес при выборе: тип с весом 10 выпадает вдвое чаще типа с весом 5
  weight: 10
  # Сколько данжей этого типа стоит одновременно, -1 без ограничения
  limit: -1
  # Допустимый перепад высот земли под данжем в блоках
  flatness: 3
  # Сдвиг по высоте от поверхности земли
  height: 0

functions:
  # Как открыть закрытое хранилище: key (ключ), pickaxe (кирка взломщика), timer (отсчёт после клика)
  open-type: key
  # Длительность отсчёта для timer: 30s, 5m, 1h
  open-time: 60s
  # Сколько ударов киркой нужно для pickaxe
  pickaxe-hits: 12
  # Шанс от 0 до 100, что ключ не сломается после открытия (для key)
  key-save-chance: 50
  # Блоки из схемы, которые станут закрытыми хранилищами с лутом. SHULKER_BOX: шалкеры всех цветов
  containers: [SHULKER_BOX]
  # Блоки, которые просто заполняются лутом без замка
  loot-containers: [BARREL]

auto:
  # Удалять данж после зачистки
  enabled: true
  # Через сколько удалить после выполнения условий из require
  time: 10s
  # Удалить через это время после спавна в любом случае, 0 без ограничения
  lifetime: 0
  # Что считается зачисткой
  require:
    # Все хранилища открыты
    opened: true
    # Все хранилища опустошены
    looted: true
  # Показывать игрокам внутри данжа таймер до удаления
  actionbar: true
  respawn:
    # После удаления заспавнить новый данж в том же мире
    enabled: true
    # Задержка перед новым спавном
    time: 1s
    # true: спавнить, только если в мире есть игроки
    need-players: false
